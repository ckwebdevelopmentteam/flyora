name: Flyora CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: https://api.flyoratravels.com/api/v1
      VITE_API_URL: https://api.flyoratravels.com/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test special fares API
        run: npm run test:special-fares --workspace=@flyora/api
      - name: Test special fares admin page
        run: npm exec --workspace=@flyora/admin -- vitest run src/pages/special-fares/SpecialFaresPage.test.tsx
      - name: Test special fares website
        run: npm exec --workspace=@flyora/web -- vitest run src/app/special-fares/page.test.tsx
      - name: Build API
        run: npm run build --workspace=@flyora/api
      - name: Build admin panel
        run: npm run build --workspace=@flyora/admin
      - name: Build website
        run: npm run build --workspace=@flyora/web
      - name: Verify shared API packages load
        run: node --import tsx -e "require('@flyora/validators'); require('@flyora/database')"
      - name: Package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf "$RUNNER_TEMP/flyora-release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./docs' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.tsbuildinfo' \
            --exclude='*/.next/cache' \
            .
      - name: Verify packaged release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/flyora-validation"
          tar -xzf "$RUNNER_TEMP/flyora-release.tar.gz" -C "$RUNNER_TEMP/flyora-validation"
          cd "$RUNNER_TEMP/flyora-validation"
          test -f apps/api/dist/server.js
          test -f apps/admin/dist/index.html
          test -f apps/web/.next/BUILD_ID
          node --import tsx -e "require('@flyora/validators'); require('@flyora/database')"
      - name: Save release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flyora-release-${{ github.sha }}
          path: ${{ runner.temp }}/flyora-release.tar.gz
          if-no-files-found: error
          retention-days: 7
