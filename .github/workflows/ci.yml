name: Flyora CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test special fares API
        run: npm run test:special-fares --workspace=@flyora/api
      - name: Test special fares admin page
        run: npm exec --workspace=@flyora/admin -- vitest run src/pages/special-fares/SpecialFaresPage.test.tsx
      - name: Test special fares website
        run: npm exec --workspace=@flyora/web -- vitest run src/app/special-fares/page.test.tsx
      - name: Build API
        run: npm run build --workspace=@flyora/api
      - name: Build admin panel
        run: npm run build --workspace=@flyora/admin
      - name: Build website
        run: npm run build --workspace=@flyora/web
